<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 
    סמלי קוד < >
    נדחפו מעט החוצה כדי לא לגעת ברקע החדש.
    הם נשארים באזור השקוף ומשתלבים עם צבע הדפדפן.
  -->
  <g fill="none" stroke="#94a3b8" stroke-width="48" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="72,112 16,256 72,400" />
    <polyline points="440,112 496,256 440,400" />
  </g>

  <!-- 
    רקע מקומי לאותיות (Pill)
    צבע: Slate-100 (#f1f5f9) - לבן-אפרפר יוקרתי ועדין.
    ממורכז מתמטית: רוחב 288, מתחיל ב-112.
  -->
  <rect x="112" y="80" width="288" height="352" rx="80" fill="#f1f5f9" />

  <!-- 
    האותיות IZ
    עובי: 64px. 
    ממורכזות בול בתוך הגלולה הבהירה כדי להבטיח נראות בכל דפדפן.
  -->
  <g fill="none" stroke-width="64" stroke-linecap="round" stroke-linejoin="round">
    <!-- האות I (אפור כהה מאוד) -->
    <line x1="160" y1="128" x2="160" y2="384" stroke="#0f172a" />
    
    <!-- האות Z (כחול זוהר) -->
    <polyline points="240,128 352,128 240,384 352,384" stroke="#2563eb" />
  </g>
</svg>
